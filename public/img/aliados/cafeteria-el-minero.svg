<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1A0E"/>
      <stop offset="50%" stop-color="#1E1008"/>
      <stop offset="100%" stop-color="#12090A"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="50%" stop-color="#E07B39"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bgGrad2)"/>
  <rect x="8" y="8" width="304" height="224" rx="12" fill="none" stroke="url(#goldGrad2)" stroke-width="1.5" stroke-opacity="0.4"/>
  <g transform="translate(160, 105)" filter="url(#glow2)">
    <!-- Taza de Café humeante -->
    <path d="M-30 -10 C-30 25, 30 25, 30 -10 Z" fill="#1E1008" stroke="url(#goldGrad2)" stroke-width="3"/>
    <!-- Asa -->
    <path d="M30 -5 C45 -5, 45 15, 30 15" fill="none" stroke="url(#goldGrad2)" stroke-width="3"/>
    <!-- Plato -->
    <ellipse cx="0" cy="25" rx="42" ry="7" fill="none" stroke="url(#goldGrad2)" stroke-width="2.5"/>
    <!-- Vapor caliente -->
    <path d="M-12 -18 Q-8 -28, -12 -38" fill="none" stroke="#F2C94C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M0 -22 Q5 -32, 0 -42" fill="none" stroke="#F2C94C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M12 -18 Q16 -28, 12 -38" fill="none" stroke="#F2C94C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>
  <text x="160" y="195" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="14" fill="#F5E6C8" letter-spacing="1">CAFETERÍA EL MINERO</text>
  <text x="160" y="215" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#A08060">SABORES Y TRADICIÓN</text>
</svg>
