<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1A0E"/>
      <stop offset="50%" stop-color="#1E1008"/>
      <stop offset="100%" stop-color="#12090A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="304" height="224" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <g transform="translate(160, 105)" filter="url(#glow)">
    <!-- Tranvía Vectorial -->
    <rect x="-60" y="-35" width="120" height="60" rx="8" fill="#1E1008" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Techo arqueado -->
    <path d="M-65 -35 Q 0 -50 65 -35 Z" fill="url(#goldGrad)"/>
    <!-- Ventanas -->
    <rect x="-50" y="-25" width="20" height="22" rx="3" fill="#F2C94C" fill-opacity="0.3" stroke="#F2C94C" stroke-width="1.5"/>
    <rect x="-22" y="-25" width="20" height="22" rx="3" fill="#F2C94C" fill-opacity="0.3" stroke="#F2C94C" stroke-width="1.5"/>
    <rect x="5" y="-25" width="20" height="22" rx="3" fill="#F2C94C" fill-opacity="0.3" stroke="#F2C94C" stroke-width="1.5"/>
    <rect x="32" y="-25" width="20" height="22" rx="3" fill="#F2C94C" fill-opacity="0.3" stroke="#F2C94C" stroke-width="1.5"/>
    <!-- Ruedas -->
    <circle cx="-38" cy="28" r="12" fill="#12090A" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="-38" cy="28" r="4" fill="#F2C94C"/>
    <circle cx="38" cy="28" r="12" fill="#12090A" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="38" cy="28" r="4" fill="#F2C94C"/>
    <!-- Riel -->
    <line x1="-75" y1="40" x2="75" y2="40" stroke="#D4A017" stroke-width="3" stroke-linecap="round"/>
    <line x1="-70" y1="44" x2="-60" y2="44" stroke="#8B6914" stroke-width="2"/>
    <line x1="-30" y1="44" x2="-20" y2="44" stroke="#8B6914" stroke-width="2"/>
    <line x1="10" y1="44" x2="20" y2="44" stroke="#8B6914" stroke-width="2"/>
    <line x1="50" y1="44" x2="60" y2="44" stroke="#8B6914" stroke-width="2"/>
    <!-- Faro delantero -->
    <circle cx="60" cy="0" r="5" fill="#F2C94C"/>
  </g>
  <text x="160" y="195" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="14" fill="#F5E6C8" letter-spacing="1">TRANVÍA TURÍSTICO</text>
  <text x="160" y="215" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#A08060">EL ORO, PUEBLO MÁGICO</text>
</svg>
