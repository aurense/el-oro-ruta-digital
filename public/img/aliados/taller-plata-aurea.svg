<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1A0E"/>
      <stop offset="50%" stop-color="#1E1008"/>
      <stop offset="100%" stop-color="#12090A"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#9E9E9E"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bgGrad3)"/>
  <rect x="8" y="8" width="304" height="224" rx="12" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5" stroke-opacity="0.4"/>
  <g transform="translate(160, 105)" filter="url(#glow3)">
    <!-- Yunque y Joya artesanal -->
    <path d="M-35 15 L35 15 L25 30 L-25 30 Z" fill="#1E1008" stroke="url(#goldGrad3)" stroke-width="2.5"/>
    <path d="M-30 15 C-30 0, -10 -5, 0 -20 C10 -5, 30 0, 30 15 Z" fill="#1E1008" stroke="url(#silverGrad)" stroke-width="2.5"/>
    <!-- Diamante / Gema central -->
    <polygon points="0,-35 18,-18 0,0 -18,-18" fill="url(#silverGrad)" stroke="#F2C94C" stroke-width="1.5"/>
    <polygon points="0,-35 0,0" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Martillo orfebre -->
    <line x1="-32" y1="-25" x2="32" y2="20" stroke="#D4A017" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="22" y="12" width="16" height="12" rx="2" transform="rotate(35 30 18)" fill="#F2C94C"/>
  </g>
  <text x="160" y="195" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="14" fill="#F5E6C8" letter-spacing="1">PLATA ÁUREA</text>
  <text x="160" y="215" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#A08060">JOYERÍA &amp; ORFEBRERÍA</text>
</svg>
