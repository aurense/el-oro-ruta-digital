<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1A0E"/>
      <stop offset="50%" stop-color="#1E1008"/>
      <stop offset="100%" stop-color="#12090A"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C94C"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="320" height="240" rx="16" fill="url(#bgGrad4)"/>
  <rect x="8" y="8" width="304" height="224" rx="12" fill="none" stroke="url(#goldGrad4)" stroke-width="1.5" stroke-opacity="0.4"/>
  <g transform="translate(160, 100)" filter="url(#glow4)">
    <!-- Fachada Colonial / Hotel Boutique -->
    <path d="M-40 25 L-40 -10 L0 -35 L40 -10 L40 25 Z" fill="#1E1008" stroke="url(#goldGrad4)" stroke-width="3"/>
    <!-- Puerta arqueada -->
    <path d="M-10 25 L-10 5 Q0 -5 10 5 L10 25 Z" fill="#F2C94C" fill-opacity="0.25" stroke="#F2C94C" stroke-width="1.5"/>
    <!-- Ventanas -->
    <rect x="-30" y="-2" width="12" height="15" rx="2" fill="#F2C94C" fill-opacity="0.3" stroke="#F2C94C" stroke-width="1"/>
    <rect x="18" y="-2" width="12" height="15" rx="2" fill="#F2C94C" fill-opacity="0.3" stroke="#F2C94C" stroke-width="1"/>
    <!-- Balcón o detalle superior -->
    <circle cx="0" cy="-18" r="6" fill="none" stroke="#F2C94C" stroke-width="1.5"/>
    <!-- Estrellas boutique -->
    <text x="0" y="38" text-anchor="middle" font-size="11" fill="#F2C94C">★★★★★</text>
  </g>
  <text x="160" y="195" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="14" fill="#F5E6C8" letter-spacing="1">HOTEL CASA REAL</text>
  <text x="160" y="215" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#A08060">HOSPEDAJE BOUTIQUE</text>
</svg>
