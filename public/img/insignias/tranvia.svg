<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2C94C" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#D4A017" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="stampBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Sello dentado / insignia de viaje -->
  <circle cx="100" cy="100" r="92" fill="#1E1008" stroke="url(#stampBorder)" stroke-width="4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#D4A017" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="100" cy="100" r="72" fill="#12090A" stroke="#8B6914" stroke-width="2"/>
  
  <!-- Icono central del tranvía -->
  <g transform="translate(100, 92) scale(0.7)">
    <rect x="-45" y="-25" width="90" height="46" rx="6" fill="#1E1008" stroke="#F2C94C" stroke-width="2.5"/>
    <path d="M-50 -25 Q 0 -38 50 -25 Z" fill="#F2C94C"/>
    <rect x="-35" y="-18" width="16" height="18" rx="2" fill="#F2C94C" fill-opacity="0.4"/>
    <rect x="-12" y="-18" width="24" height="18" rx="2" fill="#F2C94C" fill-opacity="0.4"/>
    <rect x="19" y="-18" width="16" height="18" rx="2" fill="#F2C94C" fill-opacity="0.4"/>
    <circle cx="-28" cy="26" r="9" fill="#12090A" stroke="#F2C94C" stroke-width="2.5"/>
    <circle cx="28" cy="26" r="9" fill="#12090A" stroke="#F2C94C" stroke-width="2.5"/>
    <line x1="-50" y1="37" x2="50" y2="37" stroke="#D4A017" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Leyendas circulares o texto -->
  <text x="100" y="148" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="9" fill="#F2C94C" letter-spacing="1.5">TRANVÍA TURÍSTICO</text>
  <text x="100" y="160" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" fill="#A08060" letter-spacing="1">EL ORO • AVENTURA</text>
</svg>
